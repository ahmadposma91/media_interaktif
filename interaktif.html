<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Selesaikan Persamaan! — PLSV Fase D</title>
<style>
  /* ====== VARIABEL WARNA (mendukung dark mode) ====== */
  :root{
    --bg:#eef2f7;
    --surface:#ffffff;
    --surface-2:#f7f9fc;
    --text:#0f172a;
    --muted:#64748b;
    --border:#dbe3ec;
    --primary:#2563eb;
    --primary-soft:#dbeafe;
    --on-primary:#ffffff;
    --green:#15803d;
    --red:#b91c1c;
    --amber:#b45309;
    --amber-soft:#fef3c7;
    --dot-idle:#cbd5e1;
  }
  html[data-theme="dark"]{
    --bg:#0b1220;
    --surface:#151f31;
    --surface-2:#1c2739;
    --text:#e6edf7;
    --muted:#94a3b8;
    --border:#2a3852;
    --primary:#60a5fa;
    --primary-soft:#1e3a5f;
    --on-primary:#08111f;
    --green:#4ade80;
    --red:#f87171;
    --amber:#fbbf24;
    --amber-soft:#3a2c0c;
    --dot-idle:#3b4a63;
  }

  *{box-sizing:border-box;}
  [hidden]{display:none !important;}

  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size:17px;
    line-height:1.5;
    -webkit-text-size-adjust:100%;
  }

  /* ====== HEADER ====== */
  header{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding:12px 20px;
    background:var(--surface);
    border-bottom:1px solid var(--border);
  }
  .brand{font-weight:800; font-size:19px; letter-spacing:-0.2px;}
  .brand small{
    display:block; font-weight:500; font-size:12px;
    color:var(--muted); letter-spacing:0;
  }
  .header-right{display:flex; align-items:center; gap:10px;}
  .icon-btn{
    width:42px; height:42px; border-radius:10px; cursor:pointer;
    border:1px solid var(--border); background:var(--surface-2);
    color:var(--text); font-size:18px; line-height:1;
  }
  .icon-btn:hover{background:var(--primary-soft);}
  .score-box{
    background:var(--primary-soft); color:var(--primary);
    border-radius:10px; padding:9px 14px;
    font-weight:800; font-size:16px; white-space:nowrap;
  }

  /* ====== TAB LEVEL ====== */
  .tabs{
    display:flex; gap:8px;
    max-width:820px; margin:16px auto 0; padding:0 20px;
  }
  .tab{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:1px;
    padding:10px 6px; cursor:pointer; font-family:inherit;
    background:var(--surface); color:var(--muted);
    border:1px solid var(--border); border-radius:10px;
    transition:background .12s, color .12s, border-color .12s;
  }
  .tab-num{font-size:11px; font-weight:700; opacity:.85; letter-spacing:.3px;}
  .tab-name{font-size:15px; font-weight:800;}
  .tab:hover:not(.locked):not(.active){background:var(--surface-2);}
  .tab.active{
    background:var(--primary); color:var(--on-primary); border-color:var(--primary);
  }
  .tab.active .tab-num{opacity:.9;}
  .tab.locked{opacity:.5; cursor:not-allowed;}

  /* ====== LAYOUT ====== */
  main{max-width:820px; margin:0 auto; padding:16px 20px 48px;}

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:22px;
  }

  .top-row{
    display:flex; align-items:center; justify-content:space-between;
    gap:14px; flex-wrap:wrap; margin-bottom:10px;
  }
  .dots{display:flex; gap:10px;}
  .dot{
    width:15px; height:15px; border-radius:50%;
    background:var(--dot-idle);
    transition:background .15s;
  }
  .dot.active{background:var(--primary);}
  .dot.correct{background:var(--green);}
  .dot.wrong{background:var(--red);}

  .level-score{font-size:14px; color:var(--muted); font-weight:600;}
  .level-score strong{color:var(--text); font-size:16px;}

  .qmeta{margin:0 0 4px; font-size:14px; color:var(--muted); font-weight:600;}
  .qmeta strong{color:var(--text);}

  .equation{
    text-align:center;
    font-size:clamp(28px, 7vw, 46px);
    font-weight:800;
    letter-spacing:1.5px;
    font-variant-numeric:tabular-nums;
    margin:22px 0 26px;
    word-break:break-word;
  }
  .equation i{font-style:italic;}

  .answer-row{
    display:flex; align-items:center; justify-content:center;
    gap:10px; flex-wrap:wrap;
  }
  .answer-row label{font-size:22px; font-weight:800; font-style:italic;}

  #answerInput{
    width:140px; padding:12px 14px; text-align:center;
    font-family:inherit; font-size:22px; font-weight:800;
    color:var(--text); background:var(--surface-2);
    border:2px solid var(--border); border-radius:10px;
  }
  #answerInput:focus{outline:none; border-color:var(--primary);}
  #answerInput:disabled{opacity:.65;}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  input[type=number]{-moz-appearance:textfield;}

  .btn{
    font-family:inherit; font-size:16px; font-weight:800;
    padding:12px 22px; border-radius:10px; cursor:pointer;
    border:1px solid transparent; transition:filter .12s, background .12s;
  }
  .btn-primary{background:var(--primary); color:var(--on-primary);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{
    background:var(--surface-2); color:var(--text); border-color:var(--border);
  }
  .btn-ghost:hover{background:var(--primary-soft);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}

  .feedback{
    min-height:26px; margin-top:16px; text-align:center;
    font-weight:800; font-size:17px;
  }
  .feedback.ok{color:var(--green);}
  .feedback.no{color:var(--red);}
  .feedback.info{color:var(--muted); font-weight:600; font-size:15px;}

  .hint{
    margin-top:16px; padding:14px 16px; border-radius:10px;
    background:var(--amber-soft); border:1px solid var(--amber);
    color:var(--amber); font-size:15px; line-height:1.6;
  }
  .hint-title{display:block; font-weight:800; margin-bottom:5px;}

  /* ====== HASIL LEVEL ====== */
  .result{text-align:center;}
  .res-icon{font-size:46px; line-height:1; margin-bottom:6px;}
  .result h2{margin:0 0 4px; font-size:24px;}
  .res-stats{
    display:grid; gap:10px; margin:20px 0;
    grid-template-columns:repeat(auto-fit, minmax(150px,1fr));
    text-align:left;
  }
  .stat{
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:10px; padding:12px 14px;
  }
  .stat span{display:block; font-size:13px; color:var(--muted); font-weight:600; margin-bottom:3px;}
  .stat strong{font-size:20px;}
  .res-msg{
    margin:0 0 22px; font-size:16px; color:var(--muted); font-weight:600;
    max-width:560px; margin-left:auto; margin-right:auto;
  }
  .btn-row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}

  @media (max-width:520px){
    body{font-size:16px;}
    .brand small{display:none;}
    .card{padding:18px 16px;}
    .tab-name{font-size:13px;}
    .tab-num{font-size:10px;}
    header{padding:10px 14px;}
    .tabs, main{padding-left:14px; padding-right:14px;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    Selesaikan Persamaan!
    <small>Matematika Fase D · Persamaan Linear Satu Variabel</small>
  </div>
  <div class="header-right">
    <button class="icon-btn" id="themeBtn" title="Ganti tema" aria-label="Ganti tema">🌙</button>
    <div class="score-box">Skor Total: <span id="totalScore">0</span></div>
  </div>
</header>

<nav class="tabs" id="tabs" aria-label="Pilih level"></nav>

<main>
  <!-- ====== TAMPILAN BERMAIN ====== -->
  <section id="playView">
    <div class="card">
      <div class="top-row">
        <div class="dots" id="dots" aria-label="Kemajuan soal"></div>
        <div class="level-score">Skor level: <strong id="levelScore">0</strong></div>
      </div>

      <p class="qmeta">Soal <strong id="qNum">1</strong> dari 5 · Level <strong id="lvlName">Mudah</strong></p>

      <div class="equation" id="equation">x + 5 = 12</div>

      <div class="answer-row">
        <label for="answerInput">x =</label>
        <input id="answerInput" type="number" inputmode="numeric" autocomplete="off" placeholder="?" />
        <button class="btn btn-primary" id="submitBtn">Periksa</button>
      </div>

      <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
      <div class="hint" id="hintBox" hidden></div>
    </div>
  </section>

  <!-- ====== TAMPILAN HASIL LEVEL ====== -->
  <section id="resultView" class="card result" hidden>
    <div class="res-icon" id="resIcon">🎉</div>
    <h2 id="resTitle">Level Selesai</h2>
    <div class="res-stats" id="resStats"></div>
    <p class="res-msg" id="resMsg"></p>
    <div class="btn-row" id="resBtns"></div>
  </section>
</main>

<script>
/* =========================================================
   DATA SOAL — 3 level × 5 soal, jawaban bilangan bulat
   ========================================================= */
const LEVELS = [
  {
    name: "Mudah",
    questions: [
      { eq: "x + 5 = 12", answer: 7,
        hints: ["Kurangi kedua ruas dengan 5 agar x berdiri sendiri.",
                "x = 12 − 5"] },
      { eq: "3x = 27", answer: 9,
        hints: ["3x berarti 3 dikali x. Bagi kedua ruas dengan 3.",
                "x = 27 ÷ 3"] },
      { eq: "x − 8 = 4", answer: 12,
        hints: ["Tambahkan 8 pada kedua ruas.",
                "x = 4 + 8"] },
      { eq: "4x = 32", answer: 8,
        hints: ["Bagi kedua ruas dengan 4.",
                "x = 32 ÷ 4"] },
      { eq: "x + 9 = 15", answer: 6,
        hints: ["Kurangi kedua ruas dengan 9.",
                "x = 15 − 9"] }
    ]
  },
  {
    name: "Sedang",
    questions: [
      { eq: "2x + 3 = 11", answer: 4,
        hints: ["Kurangi 3 pada kedua ruas lebih dulu.",
                "2x = 11 − 3 = 8, lalu bagi 2."] },
      { eq: "2(x + 4) = 18", answer: 5,
        hints: ["Bagi kedua ruas dengan 2 lebih dulu (atau jabarkan kurungnya).",
                "x + 4 = 9, lalu kurangi 4."] },
      { eq: "5x − 7 = 18", answer: 5,
        hints: ["Tambahkan 7 pada kedua ruas.",
                "5x = 25, lalu bagi 5."] },
      { eq: "3(x − 2) = 12", answer: 6,
        hints: ["Bagi kedua ruas dengan 3 lebih dulu.",
                "x − 2 = 4, lalu tambahkan 2."] },
      { eq: "4x + 5 = 25", answer: 5,
        hints: ["Kurangi 5 pada kedua ruas.",
                "4x = 20, lalu bagi 4."] }
    ]
  },
  {
    name: "Sulit",
    questions: [
      { eq: "3x + 4 = x + 12", answer: 4,
        hints: ["Kurangi x pada kedua ruas agar variabel berkumpul di ruas kiri.",
                "2x + 4 = 12, lalu kurangi 4 dan bagi 2."] },
      { eq: "4(x − 2) = 2x + 6", answer: 7,
        hints: ["Jabarkan kurung lebih dulu: 4x − 8 = 2x + 6.",
                "Kurangi 2x pada kedua ruas → 2x − 8 = 6."] },
      { eq: "5x − 3 = 2x + 9", answer: 4,
        hints: ["Kurangi 2x pada kedua ruas.",
                "3x − 3 = 9, lalu tambahkan 3 dan bagi 3."] },
      { eq: "2(x + 5) = 3x + 4", answer: 6,
        hints: ["Jabarkan kurung lebih dulu: 2x + 10 = 3x + 4.",
                "Kurangi 2x pada kedua ruas → 10 = x + 4."] },
      { eq: "6x + 2 = 3x + 20", answer: 6,
        hints: ["Kurangi 3x pada kedua ruas.",
                "3x + 2 = 20, lalu kurangi 2 dan bagi 3."] }
    ]
  }
];

const QUESTIONS_PER_LEVEL = 5;
const POIN_PERTAMA = 10;
const POIN_SETELAH_HINT = 5;
const MAX_SKOR_LEVEL = QUESTIONS_PER_LEVEL * POIN_PERTAMA; // 50
const SKOR_LULUS = Math.ceil(MAX_SKOR_LEVEL * 0.6);        // 30 (60%)

/* =========================== ELEMEN =========================== */
const dotsEl       = document.getElementById('dots');
const tabsEl       = document.getElementById('tabs');
const playView     = document.getElementById('playView');
const resultView   = document.getElementById('resultView');
const equationEl   = document.getElementById('equation');
const input        = document.getElementById('answerInput');
const submitBtn    = document.getElementById('submitBtn');
const feedbackEl   = document.getElementById('feedback');
const hintBox      = document.getElementById('hintBox');
const qNumEl       = document.getElementById('qNum');
const lvlNameEl    = document.getElementById('lvlName');
const levelScoreEl = document.getElementById('levelScore');
const totalScoreEl = document.getElementById('totalScore');
const themeBtn     = document.getElementById('themeBtn');
const resIcon      = document.getElementById('resIcon');
const resTitle     = document.getElementById('resTitle');
const resStats     = document.getElementById('resStats');
const resMsg       = document.getElementById('resMsg');
const resBtns      = document.getElementById('resBtns');

/* =========================== STATE =========================== */
const state = {
  level: 0,
  qIndex: 0,
  dots: [null, null, null, null, null], // null | 'correct' | 'wrong'
  hintCount: 0,
  answered: false,
  levelScore: 0,
  levelCorrect: 0,
  best: [0, 0, 0],
  passed: [false, false, false]
};

/* =========================== TEMA =========================== */
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
}
applyTheme(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
themeBtn.addEventListener('click', () => {
  const now = document.documentElement.getAttribute('data-theme');
  applyTheme(now === 'dark' ? 'light' : 'dark');
});

/* =========================== UTIL =========================== */
function totalScore(){
  return state.best.reduce((a, b) => a + b, 0);
}
function updateTotalScore(){
  totalScoreEl.textContent = totalScore();
}
function mathify(str){
  return str.replace(/x/g, '<i>x</i>');
}
function showFeedback(text, cls){
  feedbackEl.textContent = text;
  feedbackEl.className = 'feedback' + (cls ? ' ' + cls : '');
}

/* =========================== TAB LEVEL =========================== */
function renderTabs(){
  tabsEl.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const locked = i > 0 && !state.passed[i - 1];
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'tab' + (locked ? ' locked' : '') + (i === state.level ? ' active' : '');
    btn.disabled = locked;
    btn.innerHTML =
      '<span class="tab-num">' + (locked ? '🔒 ' : '') + 'Level ' + (i + 1) + '</span>' +
      '<span class="tab-name">' + lv.name + '</span>';
    btn.addEventListener('click', () => startLevel(i));
    tabsEl.appendChild(btn);
  });
}

/* =========================== DOT PROGRESS =========================== */
function renderDots(){
  dotsEl.innerHTML = '';
  for (let i = 0; i < QUESTIONS_PER_LEVEL; i++){
    const d = document.createElement('span');
    d.className = 'dot';
    if (state.dots[i] === 'correct')      d.classList.add('correct');
    else if (state.dots[i] === 'wrong')   d.classList.add('wrong');
    else if (i === state.qIndex)          d.classList.add('active');
    dotsEl.appendChild(d);
  }
}

/* =========================== ALUR PERMAINAN =========================== */
function startLevel(index){
  state.level = index;
  state.qIndex = 0;
  state.dots = [null, null, null, null, null];
  state.levelScore = 0;
  state.levelCorrect = 0;

  resultView.hidden = true;
  playView.hidden = false;

  renderTabs();
  renderQuestion();
  updateTotalScore();
}

function renderQuestion(){
  const lv = LEVELS[state.level];
  const q = lv.questions[state.qIndex];

  state.answered = false;
  state.hintCount = 0;

  equationEl.innerHTML = mathify(q.eq);
  qNumEl.textContent = state.qIndex + 1;
  lvlNameEl.textContent = lv.name;
  levelScoreEl.textContent = state.levelScore;

  hintBox.hidden = true;
  hintBox.innerHTML = '';
  showFeedback('', '');
  input.value = '';
  input.disabled = false;
  submitBtn.disabled = false;
  submitBtn.textContent = 'Periksa';

  renderDots();
  input.focus();
}

function showHint(q){
  const hints = q.hints;
  const idx = Math.min(state.hintCount, hints.length - 1);
  state.hintCount++;
  const label = Math.min(state.hintCount, hints.length);

  hintBox.hidden = false;
  hintBox.innerHTML =
    '<span class="hint-title">💡 Petunjuk langkah ' + label + '</span>' + hints[idx];
}

function submit(){
  // Jika soal sudah dijawab benar, tombol berfungsi sebagai "Lanjut"
  if (state.answered){
    nextQuestion();
    return;
  }

  const raw = input.value.trim();
  if (raw === '' || isNaN(Number(raw))){
    showFeedback('Masukkan jawaban berupa bilangan bulat dulu ya.', 'info');
    input.focus();
    return;
  }

  const val = Number(raw);
  const q = LEVELS[state.level].questions[state.qIndex];

  if (val === q.answer){
    /* ---- JAWABAN BENAR ---- */
    const poin = state.hintCount > 0 ? POIN_SETELAH_HINT : POIN_PERTAMA;
    state.levelScore += poin;
    state.levelCorrect++;
    state.dots[state.qIndex] = 'correct';
    state.answered = true;

    levelScoreEl.textContent = state.levelScore;
    renderDots();
    showFeedback('Benar! +' + poin + ' poin 🎯', 'ok');

    input.disabled = true;
    submitBtn.textContent = (state.qIndex === QUESTIONS_PER_LEVEL - 1)
      ? 'Lihat Hasil →'
      : 'Soal Berikutnya →';
    submitBtn.focus();
  } else {
    /* ---- JAWABAN SALAH ---- */
    state.dots[state.qIndex] = 'wrong';
    renderDots();
    showFeedback('Belum tepat, coba lagi.', 'no');
    showHint(q);
    input.select();
    input.focus();
  }
}

function nextQuestion(){
  if (state.qIndex >= QUESTIONS_PER_LEVEL - 1){
    finishLevel();
    return;
  }
  state.qIndex++;
  renderQuestion();
}

/* =========================== HASIL LEVEL =========================== */
function finishLevel(){
  const idx = state.level;
  const skorLevel = state.levelScore;
  const lulus = skorLevel >= SKOR_LULUS;

  state.best[idx] = Math.max(state.best[idx], skorLevel);
  if (lulus) state.passed[idx] = true;

  updateTotalScore();
  renderTabs();

  playView.hidden = true;
  resultView.hidden = false;

  /* Ikon & judul */
  resIcon.textContent = lulus ? (skorLevel === MAX_SKOR_LEVEL ? '🏆' : '🎉') : '💪';
  resTitle.textContent = lulus
    ? 'Level ' + (idx + 1) + ' Lulus!'
    : 'Level ' + (idx + 1) + ' Belum Lulus';

  /* Statistik */
  resStats.innerHTML =
    '<div class="stat"><span>Jawaban benar</span><strong>' + state.levelCorrect + ' / ' + QUESTIONS_PER_LEVEL + '</strong></div>' +
    '<div class="stat"><span>Skor level ini</span><strong>' + skorLevel + ' / ' + MAX_SKOR_LEVEL + '</strong></div>' +
    '<div class="stat"><span>Skor terbaik level</span><strong>' + state.best[idx] + ' / ' + MAX_SKOR_LEVEL + '</strong></div>' +
    '<div class="stat"><span>Skor total</span><strong>' + totalScore() + '</strong></div>';

  /* Pesan motivasi */
  let pesan;
  if (skorLevel === MAX_SKOR_LEVEL){
    pesan = 'Sempurna! Semua soal kamu jawab benar tanpa perlu petunjuk. Pertahankan ya! 🌟';
  } else if (lulus && skorLevel >= 40){
    pesan = 'Hebat! Pemahamanmu tentang persamaan linear satu variabel sudah kuat.';
  } else if (lulus){
    pesan = 'Bagus! Kamu sudah lulus level ini. Sedikit latihan lagi pasti makin mantap.';
  } else {
    pesan = 'Jangan menyerah! Baca kembali petunjuk langkahnya, lalu ulangi level ini. Kamu pasti bisa!';
  }
  if (lulus && idx === LEVELS.length - 1){
    pesan += ' Kamu telah menuntaskan seluruh level — luar biasa! 🎓';
  }
  resMsg.textContent = pesan;

  /* Tombol aksi */
  resBtns.innerHTML = '';

  if (lulus && idx < LEVELS.length - 1){
    const nextBtn = document.createElement('button');
    nextBtn.className = 'btn btn-primary';
    nextBtn.textContent = 'Lanjut ke Level ' + (idx + 2) + ' →';
    nextBtn.addEventListener('click', () => startLevel(idx + 1));
    resBtns.appendChild(nextBtn);
  }

  const retryBtn = document.createElement('button');
  retryBtn.className = 'btn btn-ghost';
  retryBtn.textContent = 'Ulangi Level ' + (idx + 1);
  retryBtn.addEventListener('click', () => startLevel(idx));
  resBtns.appendChild(retryBtn);

  if (lulus && idx === LEVELS.length - 1){
    const againBtn = document.createElement('button');
    againBtn.className = 'btn btn-ghost';
    againBtn.textContent = 'Mulai dari Level 1';
    againBtn.addEventListener('click', () => startLevel(0));
    resBtns.appendChild(againBtn);
  }
}

/* =========================== EVENT =========================== */
submitBtn.addEventListener('click', submit);

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter'){
    e.preventDefault();
    submit();
  }
});

/* =========================== MULAI =========================== */
renderTabs();
updateTotalScore();
startLevel(0);
</script>
</body>
</html>
